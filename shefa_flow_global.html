<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHEFA FLOW | El Umbral de la Materialización Global</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Montserrat:wght@300;400;600;700&display=swap');
        
        body {
            background: radial-gradient(circle at 50% 0%, #0a1128 0%, #050814 80%);
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .boveda-card {
            background: rgba(10, 17, 40, 0.94);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.45);
            box-shadow: 0 0 70px rgba(0, 0, 0, 0.98), inset 0 0 35px rgba(0, 119, 255, 0.15);
            border-radius: 34px;
        }

        /* Letras de Oro Puro (Estándar Premium) */
        .titulo-oro {
            font-family: 'Cinzel', serif;
            background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 15px rgba(212, 175, 55, 0.4);
        }

        .texto-corporativo {
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        /* Números Verdes Luminosos (Pulsación Viva Berajá / Crecimiento Fibonacci) */
        @keyframes pulso-verde-luminoso {
            0%, 100% { 
                color: #10B981; 
                text-shadow: 0 0 14px rgba(16, 185, 129, 0.75), 0 0 28px rgba(16, 185, 129, 0.45); 
            }
            50% { 
                color: #34D399; 
                text-shadow: 0 0 25px rgba(52, 211, 153, 1), 0 0 45px rgba(52, 211, 153, 0.7); 
            }
        }
        .numero-verde-luminoso {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            animation: pulso-verde-luminoso 2.5s infinite ease-in-out;
        }

        .selector-titanio {
            background: #12182b;
            border: 1px solid rgba(0, 119, 255, 0.4);
            color: #ffffff;
            transition: all 0.3s ease;
        }
        
        .selector-titanio:focus {
            outline: none;
            border-color: #d4af37;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }

        /* Botones Asimétricos de Poder Global */
        .btn-metamask {
            background: linear-gradient(90deg, #F3BA2F 0%, #E8B32B 100%);
            color: #050814;
            font-weight: 800;
            border-radius: 14px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .btn-metamask:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 35px rgba(243, 186, 47, 0.75);
        }

        .btn-mercadopago {
            background: linear-gradient(90deg, #009EE3 0%, #0077B5 100%);
            color: #fff;
            font-weight: 800;
            border-radius: 14px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .btn-mercadopago:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 35px rgba(0, 158, 227, 0.75);
        }

        .btn-europa {
            background: linear-gradient(90deg, #1D4ED8 0%, #2563EB 100%);
            color: #fff;
            font-weight: 800;
            border-radius: 14px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .btn-europa:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 35px rgba(37, 99, 235, 0.75);
        }

        .ojo-despertar {
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.5);
            animation: flotar-ojo 4s infinite ease-in-out;
        }
        @keyframes flotar-ojo {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
    </style>
</head>
<body class="p-4">

    <div class="boveda-card w-full max-w-lg p-8 md:p-10 relative overflow-hidden">
        <!-- Destellos de Energía de Fondo (Titanio Azul y Oro Divino) -->
        <div class="absolute -top-12 -right-12 w-48 h-48 bg-yellow-500 rounded-full mix-blend-multiply filter blur-3xl opacity-15"></div>
        <div class="absolute -bottom-12 -left-12 w-48 h-48 bg-blue-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>

        <!-- Encabezado con el Ojo del Despertar (Nueva Era 2026) -->
        <div class="text-center mb-8 relative z-10">
            <div class="w-18 h-18 mx-auto mb-4 rounded-full p-[2px] bg-gradient-to-tr from-yellow-500 via-amber-200 to-yellow-600 ojo-despertar flex items-center justify-center bg-black">
                <div class="w-full h-full bg-[#0a1128] rounded-full flex items-center justify-center">
                    <i class="fas fa-eye text-yellow-400 text-2xl"></i>
                </div>
            </div>
            <h2 class="texto-corporativo text-[0.65rem] tracking-[0.35em] text-blue-400 mb-1">EL UMBRAL DE LA MATERIALIZACIÓN</h2>
            <h1 class="titulo-oro text-3xl md:text-4xl font-black mb-2">SHEFA FLOW</h1>
            <p class="texto-corporativo text-[0.7rem] text-yellow-500/90 tracking-widest">Berajá, Parnasá y Expansión Global</p>
        </div>

        <!-- Panel de Selección de Nodo Regional (Incluyendo España / EUR) -->
        <div class="mb-6 relative z-10">
            <label for="nodo-selector" class="texto-corporativo block text-[0.7rem] font-semibold text-gray-300 mb-2">Nodo Georregional de Poder</label>
            <select id="nodo-selector" onchange="gestionarNodo()" class="selector-titanio w-full p-3.5 rounded-xl appearance-none cursor-pointer text-sm font-semibold">
                <option value="" disabled selected>Selecciona tu coordenada de expansión...</option>
                <option value="EUROPA">🇪🇸 España / Unión Europea (EUR)</option>
                <option value="LATAM">🇨🇴 Colombia / Latam (COP / USD)</option>
                <option value="GLOBAL">🌐 Red Global / Internacional (USD)</option>
            </select>
        </div>

        <!-- Panel de Frecuencia / Monto con Números Verdes Luminosos (Secuencia Fibonacci) -->
        <div id="panel-monto" class="mb-6 relative z-10">
            <div class="flex justify-between items-center mb-2">
                <label for="input-monto" class="texto-corporativo block text-[0.7rem] font-semibold text-gray-300">Frecuencia de Inyección Áurea</label>
                <span class="text-[0.65rem] text-yellow-400/80">Proporción 1.618</span>
            </div>
            <div class="relative">
                <span class="absolute left-4 top-3.5 text-yellow-500 font-bold text-base" id="simbolo-moneda">$</span>
                <input type="number" id="input-monto" placeholder="Ej: 100" class="selector-titanio w-full p-3.5 pl-10 rounded-xl outline-none numero-verde-luminoso text-lg">
            </div>
        </div>

        <!-- Canales Absolutos de Poder y Transmisión -->
        <div id="panel-canales" class="space-y-4 relative z-10">
            <!-- Botón Dinámico de Europa (EUR) -->
            <button id="btn-canal-europa" onclick="ejecutarEuropa()" class="btn-europa w-full py-4 flex items-center justify-center gap-3 text-xs tracking-widest uppercase shadow-lg hidden cursor-pointer">
                <i class="fas fa-euro-sign text-base"></i> PASARELA EUROPA (SEPA / TARJETA EUR)
            </button>

            <!-- Botón Dinámico de Mercado Pago (Latam) -->
            <button id="btn-canal-mp" onclick="ejecutarMercadoPago()" class="btn-mercadopago w-full py-4 flex items-center justify-center gap-3 text-xs tracking-widest uppercase shadow-lg hidden cursor-pointer">
                <i class="fas fa-handshake text-base"></i> MERCADO PAGO (LATAM / FIAT)
            </button>

            <!-- Botón Universal Web3 (MetaMask) -->
            <button onclick="ejecutarMetaMask()" class="btn-metamask w-full py-4 flex items-center justify-center gap-3 text-xs tracking-widest uppercase shadow-lg cursor-pointer">
                <i class="fas fa-cube text-base"></i> INYECCIÓN METAMASK (WEB3 / GLOBAL)
            </button>
        </div>
        
        <!-- Estado del Río de Luz con Números Verdes Luminosos -->
        <div class="texto-corporativo text-[0.65rem] text-center text-gray-400 mt-6 border-t border-blue-900/40 pt-4 relative z-10">
            Río de Luz <span class="numero-verde-luminoso">Shefa-Berajá</span> fluyendo sin límites en la economía global.
        </div>
    </div>

    <script>
        function gestionarNodo() {
            const nodo = document.getElementById('nodo-selector').value;
            const simbolo = document.getElementById('simbolo-moneda');
            const btnEuropa = document.getElementById('btn-canal-europa');
            const btnMP = document.getElementById('btn-canal-mp');

            if (nodo === 'EUROPA') {
                simbolo.innerText = '€';
                btnEuropa.classList.remove('hidden');
                btnMP.classList.add('hidden');
            } else if (nodo === 'LATAM') {
                simbolo.innerText = '$';
                btnEuropa.classList.add('hidden');
                btnMP.classList.remove('hidden');
            } else {
                simbolo.innerText = '$';
                btnEuropa.classList.add('hidden');
                btnMP.classList.add('hidden');
            }
        }

        // Motor Web3 (MetaMask)
        async function ejecutarMetaMask() {
            const monto = document.getElementById('input-monto').value;
            if (!monto || monto <= 0) {
                alert("👑 BÓVEDA SHEFA:\n\nIngresa una frecuencia válida de Oro Puro para materializar.");
                return;
            }

            if (typeof window.ethereum !== 'undefined') {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    const account = accounts[0];
                    alert(`👑 BÓVEDA SHEFA WEB3:\n\nWallet vinculada (${account.substring(0,6)}...)\nInyección descentralizada de $${monto} lista para firmar.`);
                } catch (error) {
                    console.error(error);
                    alert("Fricción detectada en la red o el usuario canceló la firma.");
                }
            } else {
                window.location.href = `https://metamask.app.link/dapp/shefaplusglobal.com?monto=${monto}`;
            }
        }

        // Motor Mercado Pago (Latam)
        function ejecutarMercadoPago() {
            const monto = document.getElementById('input-monto').value;
            if (!monto || monto <= 0) {
                alert("👑 BÓVEDA SHEFA:\n\nIngresa una frecuencia válida de Oro Puro para materializar.");
                return;
            }
            const urlMercadoPago = `https://www.mercadopago.com.co/checkout/v1/redirect?pref_id=SHEFA_GLOBAL_LATAM_${monto}`;
            window.location.href = urlMercadoPago;
        }

        // Motor Europa / Euros (España)
        function ejecutarEuropa() {
            const monto = document.getElementById('input-monto').value;
            if (!monto || monto <= 0) {
                alert("👑 BÓVEDA SHEFA:\n\nIngresa una frecuencia válida en Euros para materializar.");
                return;
            }
            // Enlace de pasarela segura optimizado para la zona Euro (España)
            const urlEuropa = `https://checkout.shefaplusglobal.com/eur?amount=${monto}`;
            // Redirección directa al canal de cobro europeo en Euros
            window.location.href = `https://www.paypal.com/ncp/payment?hosted_button_id=SHEFA_EUROPA_${monto}`;
        }
    </script>
</body>
</html>
