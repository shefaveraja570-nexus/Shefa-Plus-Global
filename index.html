<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shefa Plus Global | Inicio</title>
    <!-- Importando fuente premium y minimalista -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* === RESETEO GENERAL === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* === FONDO TITANIO BLINDADO === */
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0A1122; /* Azul noche profundo / Titanio */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #ffffff;
        }

        /* === CONTENEDOR MAESTRO (LA TARJETA) === */
        .tarjeta-nucleo {
            background: linear-gradient(145deg, #18223B, #0E1629); /* Efecto blindado tridimensional */
            border-radius: 24px;
            padding: 50px 40px;
            text-align: center;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.05); /* Sombra de profundidad */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        /* === TIPOGRAFÍA DE MARCA === */
        .marca-titulo {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .texto-blanco {
            color: #FFFFFF;
        }

        .texto-dorado {
            color: #D4AF37; /* Dorado Premium */
        }

        .subtitulo-frecuencia {
            font-size: 0.75rem;
            font-weight: 400;
            letter-spacing: 4px;
            color: #8A95A5; /* Gris metalizado para contraste sutil */
            text-transform: uppercase;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        /* === BOTÓN DORADO PREMIUM === */
        .btn-ingresar {
            background: linear-gradient(145deg, #E5BA45, #C49A28);
            color: #0A1122; /* Contraste oscuro para legibilidad */
            font-size: 0.95rem;
            font-weight: 700;
            text-transform: uppercase;
            text-decoration: none;
            padding: 18px 40px;
            border-radius: 50px; /* Bordes completamente redondeados */
            border: none;
            cursor: pointer;
            width: 100%;
            max-width: 280px;
            letter-spacing: 1px;
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.3), 
                        inset 0 2px 0 rgba(255, 255, 255, 0.2); /* Resplandor dorado */
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .btn-ingresar:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(212, 175, 55, 0.5), 
                        inset 0 2px 0 rgba(255, 255, 255, 0.3);
            background: linear-gradient(145deg, #F0C755, #D4AF37);
        }

        .btn-ingresar:active {
            transform: translateY(1px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
        }
    </style>
</head>
<body>

    <main class="tarjeta-nucleo">
        <div class="identidad-corporativa">
            <h1 class="marca-titulo">
                <span class="texto-blanco">SHEFA</span><span class="texto-dorado">PLUS</span>
            </h1>
            <p class="subtitulo-frecuencia">FRECUENCIA GLOBAL<br>800 HZ</p>
        </div>

        <a href="umbral.html" class="btn-ingresar">
            INGRESAR AL<br>NÚCLEO
        </a>
    </main>

</body>
</html>
