<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHEFA PLUS GLOBAL | Arquitectura de Identidad</title>
    <style>
        :root {
            --phi: 1.618;
            --base-unit: 1rem;
            --fondo-profundo: #0a0d14;
            --acento-dorado: #d4af37;
            
            /* Escala Áurea Restablecida */
            --spacing-identity: calc(var(--base-unit) * var(--phi));
        }

        body {
            background-color: var(--fondo-profundo);
            color: #ffffff;
            font-family: 'Helvetica', sans-serif;
            padding: var(--spacing-identity);
            display: flex;
            justify-content: center;
        }

        .contenedor-principal {
            max-width: 500px;
            width: 100%;
        }

        /* Identidad de Marca Prominente */
        .header-identidad {
            text-align: center;
            margin-bottom: calc(var(--spacing-identity) * 1.5);
            border-bottom: 1px solid var(--acento-dorado);
            padding-bottom: var(--spacing-identity);
        }

        .brand-name {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--acento-dorado);
            letter-spacing: 0.15em;
            margin: 0;
            display: block;
        }

        .brand-subtitle {
            font-size: 1rem;
            opacity: 0.8;
            letter-spacing: 0.2em;
            margin-top: 0.5rem;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 1.2rem;
            margin-bottom: 1rem;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
            text-transform: uppercase;
            text-decoration: none;
            cursor: pointer;
        }

        .btn-dorado { background: var(--acento-dorado); color: #000; }
        .btn-neutro { background: #1a1a1a; color: #fff; border: 1px solid #333; }
        .btn-azul { background: #2563eb; color: white; }

        .seccion {
            background: #111;
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>

    <main class="contenedor-principal">
        <!-- Identidad Restaurada -->
        <header class="header-identidad">
            <h1 class="brand-name">SHEFA PLUS</h1>
            <p class="brand-subtitle">FRECUENCIA GLOBAL 800 HZ</p>
        </header>

        <a href="#" class="btn btn-dorado">Ingresar al Núcleo</a>

        <div class="seccion">
            <h3 style="color: var(--acento-dorado); text-align: center;">Fondo de Criptofracciones</h3>
            <p style="text-align: center; font-size: 0.9rem;">Sistema de inversión automatizado.</p>
            <a href="#" class="btn btn-dorado">Iniciar Inversión</a>
            <a href="#" class="btn btn-neutro">🔎 Módulo Automotriz</a>
        </div>

        <div class="seccion">
            <button class="btn btn-neutro" onclick="alert('Los pilares de Shefá, Parnasá y Verajá sostienen la estructura de abundancia global.')">
                El Origen
            </button>
            <a href="#" class="btn btn-azul">✉ Correo Oficial</a>
        </div>
    </main>

</body>
</html>
