    <style>
        /* ==========================================
           💎 VARIABLES DE PROPORCIÓN ÁUREA Y NEUROSHEFÁ
           ========================================== */
        :root {
            /* Colores Magnéticos */
            --fondo-abismo: #0a0f16;
            --tarjeta-fondo: #121a25;
            --blanco-puro: #ffffff;
            --gris-texto: #9ca3af;
            --oro-shefa: #fbbf24;
            --azul-parnasa: #2563eb;
            --verde-veraja: #10b981;
            
            /* Sucesión de Fibonacci en píxeles */
            --f-8: 8px;
            --f-13: 13px;
            --f-21: 21px;
            --f-34: 34px;
            --f-55: 55px;
            --f-89: 89px;
            --f-144: 144px;

            
            --line-height-aureo: 1.618;
        }

        
        {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--fondo-abismo);
            color: var(--blanco-puro);
            line-height: var(--line-height-aureo);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        main {
            width: 100%;
            max-width: 1200px; /* Expansión visual controlada */
            padding: var(--f-55) var(--f-21);
        }

        /* ==========================================
           🏛️ SECCIÓN: PILARES DE ABUNDANCIA
           ========================================== */
        .seccion-titulo {
            text-align: center;
            margin-bottom: var(--f-89);
        }

        .seccion-titulo h2 {
            font-size: var(--f-34);
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .seccion-titulo h2 span {
            color: var(--oro-shefa);
        }

        .seccion-titulo p {
            font-size: var(--f-13);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .grid-pilares {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: var(--f-34);
            padding-bottom: var(--f-55);
        }

        /* ==========================================
           🃏 TARJETAS NEUROSHEFÁ (HOVER ILUMINADO)
           ========================================== */
        .pilar-card {
            background-color: var(--tarjeta-fondo);
            border-radius: var(--f-13);
            padding: var(--f-55) var(--f-34);
            position: relative;
            overflow: hidden;
            transition: all 0.618s cubic-bezier(0.25, 0.46, 0.45, 0.94); /* Transición Áurea */
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            z-index: 1;
        }

        /* La Barra de Iluminación Oculta (Borde Superior) */
        .pilar-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--oro-shefa);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.618s ease-in-out;
            z-index: 2;
        }

        .pilar-card:hover, .pilar-card:active {
            transform: translateY(-8px);
            box-shadow: 0 var(--f-21) var(--f-55) rgba(0, 0, 0, 0.6);
            background-color: #16202d; /* Ligero aclarado de fondo */
        }

        .pilar-card:hover::before, .pilar-card:active::before {
            transform: scaleX(1); /* Despliega el rayo de luz */
        }

    
        .pilar-card.shefa::before { background: var(--azul-parnasa); box-shadow: 0 0 15px var(--azul-parnasa); }
        .pilar-card.parnasa::before { background: var(--oro-shefa); box-shadow: 0 0 15px var(--oro-shefa); }
        .pilar-card.veraja::before { background: var(--verde-veraja); box-shadow: 0 0 15px var(--verde-veraja); }

    
        .pilar-icono {
            width: var(--f-55);
            height: var(--f-55);
            background-color: rgba(255, 255, 255, 0.03);
            border-radius: var(--f-13);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: var(--f-21);
            transition: transform 0.618s ease;
        }

        .pilar-card:hover .pilar-icono {
            transform: scale(1.1); 
        }

        .pilar-icono svg {
            width: var(--f-21);
            height: var(--f-21);
            fill: var(--oro-shefa);
        }

        
        .pilar-card.shefa .pilar-icono svg { fill: var(--azul-parnasa); }
        .pilar-card.parnasa .pilar-icono svg { fill: var(--oro-shefa); }
        .pilar-card.veraja .pilar-icono svg { fill: var(--verde-veraja); }

        .pilar-card h3 {
            font-size: var(--f-21);
            margin-bottom: var(--f-13);
            font-weight: 700;
            color: var(--blanco-puro);
        }

        .pilar-card p {
            color: var(--gris-texto);
            font-size: 15px;  HD 
            line-height: var(--line-height-aureo);
        }

        /* ==========================================
           🧿 FOOTER VIBRACIONAL
           ========================================== */
        footer {
            width: 100%;
            text-align: center;
            padding: var(--f-55) var(--f-21);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: auto;
        }

        .frecuencia-texto {
            margin-top: var(--f-21);
            font-size: 0.85rem;
            color: var(--oro-shefa);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

    </style>
<style>
    /* ========================================= */
    /* AURA FIBONACCI - ANIMACIÓN DEL BOTÓN RWA  */
    /* ========================================= */
    
    @keyframes pulso-fibonacci {
        0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.8); transform: scale(1); }
        38.2% { box-shadow: 0 0 20px 5px rgba(212, 175, 55, 0.5); transform: scale(1.01); } /* Punto Áureo 1 */
        61.8% { box-shadow: 0 0 35px 15px rgba(212, 175, 55, 0.2); transform: scale(1.02); } /* Punto Áureo 2 */
        100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); transform: scale(1); }
    }

    @keyframes rotacion-luz {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    .btn-hipnotico-aureo {
        background: linear-gradient(135deg, #d4af37 0%, #8a6a1c 100%);
        color: #050b14 !important; /* Texto oscuro para contraste premium */
        position: relative;
        overflow: hidden;
        animation: pulso-fibonacci 3.14s infinite cubic-bezier(0.25, 0.1, 0.25, 1);
        border: 1px solid #ffdf73;
        z-index: 1;
        transition: all 0.3s ease;
    }

    .btn-hipnotico-aureo::before {
        content: '';
        position: absolute;
        top: -50%; left: -50%;
        width: 200%; height: 200%;
        background: conic-gradient(transparent, rgba(255, 255, 255, 0.4), transparent 30%);
        animation: rotacion-luz 6.18s linear infinite; /* Tiempo basado en 1.618 */
        z-index: -1;
    }

    .btn-hipnotico-aureo:hover {
        transform: scale(1.03) !important;
        box-shadow: 0 0 40px rgba(212, 175, 55, 0.6) !important;
        letter-spacing: 0.25em;
    }
</style>
