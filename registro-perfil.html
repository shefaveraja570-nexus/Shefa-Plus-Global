<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Perfil | Shefá Plus Global</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="https://kit.fontawesome.com/tu-codigo-font-awesome.js" crossorigin="anonymous"></script>
</head>
<body class="cuerpo-registro">

    <div class="contenedor-registro">
        <div class="cabecera-registro">
            <i class="fas fa-fingerprint icono-identidad"></i>
            <h2>Identidad Global</h2>
            <p>Ingresa tus datos para habilitar tu Bóveda y Santuario de Conexión bajo la frecuencia de Parnasá, Shefá y Verajá.</p>
        </div>

        <form class="formulario-perfil" id="form-registro">
            
            <div class="grupo-foto-perfil">
                <div class="vista-previa-foto">
                    <i class="fas fa-camera"></i>
                </div>
                <label for="subir-foto" class="btn-subir-foto">Seleccionar Fotografía</label>
                <input type="file" id="subir-foto" accept="image/*" style="display: none;">
            </div>

            <div class="grupo-input">
                <label for="nombre-completo">Nombre Completo</label>
                <input type="text" id="nombre-completo" placeholder="Ej. Johanna Manjarrés" required>
            </div>

            <div class="grupo-input">
                <label for="correo-electronico">Correo de Conexión</label>
                <input type="email" id="correo-electronico" placeholder="tu@correo.com" required>
            </div>

            <div class="grupo-input">
                <label for="fecha-nacimiento">Fecha de Nacimiento</label>
                <input type="date" id="fecha-nacimiento" required>
            </div>

            <div class="grupo-input">
                <label for="clave-acceso">Clave de Seguridad</label>
                <input type="password" id="clave-acceso" placeholder="Mínimo 6 caracteres" required>
            </div>

            <button type="button" class="btn-hipnotico-aureo btn-registro-total">
                Forjar Identidad <i class="fas fa-arrow-right ml-2"></i>
            </button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // ⚠️ ATENCIÓN MAGNÉTICO: PEGA AQUÍ TUS CLAVES EXACTAS DE FIREBASE
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "TU_PROYECTO.firebaseapp.com",
            projectId: "TU_PROYECTO",
            storageBucket: "TU_PROYECTO.appspot.com",
            messagingSenderId: "TU_SENDER_ID",
            appId: "TU_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const btnRegistro = document.querySelector('.btn-registro-total');
        
        btnRegistro.addEventListener('click', async () => {
            const nombre = document.getElementById('nombre-completo').value.trim();
            const correo = document.getElementById('correo-electronico').value.trim();
            const fechaNacimiento = document.getElementById('fecha-nacimiento').value;
            const clave = document.getElementById('clave-acceso').value;

            if(!nombre || !correo || !fechaNacimiento || !clave) {
                alert("⚠️ La matriz requiere que completes todos los campos de identidad.");
                return;
            }

            const textoOriginal = btnRegistro.innerHTML;
            btnRegistro.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sintonizando Frecuencia...';
            btnRegistro.disabled = true;

            try {
                const credencialUsuario = await createUserWithEmailAndPassword(auth, correo, clave);
                const usuario = credencialUsuario.user;

                await updateProfile(usuario, {
                    displayName: nombre
                });

                await setDoc(doc(db, "usuarios_globales", usuario.uid), {
                    nombreCompleto: nombre,
                    correoElectronico: correo,
                    fechaDeNacimiento: fechaNacimiento,
                    fechaRegistro: serverTimestamp(),
                    estadoFrecuencia: "Activo"
                });

                alert("✨ ¡Identidad forjada con éxito! El fuego ancestral ha validado tu acceso.");
                
                // Redirección automática al chat
                window.location.href = "chat-sagrado.html"; 

            } catch (error) {
                console.error("Fallo en la creación de identidad:", error);
                if(error.code === 'auth/email-already-in-use') {
                    alert("⚠️ Esta frecuencia (correo) ya está registrada en el ecosistema.");
                } else if (error.code === 'auth/weak-password') {
                    alert("⚠️ La clave de seguridad necesita más fuerza. Usa al menos 6 caracteres.");
                } else {
                    alert("⚠️ Error de conexión en la matriz: " + error.message);
                }
            } finally {
                btnRegistro.innerHTML = textoOriginal;
                btnRegistro.disabled = false;
            }
        });
    </script>
</body>
    </html>
