<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Premium | SHEFÁ PLUS GLOBAL</title>
    <script>window.onerror = function(msg, url, line) { alert("Error: " + msg + "\nURL: " + url + "\nLínea: " + line); };</script>
    <script src="https://sdk.mercadopago.com/js/v2"></script>
    <style>
        :root {
            --oro-shefa: #d4af37; --obsidiana-parnasa: #0a0a0c; --titanio-premium: #161618;
            --veraja-vital: #00e676; --fibo: 1.618; --base: 1rem;
            --pad-s: calc(var(--base) * 1); --pad-m: calc(var(--base) * 1.618); --pad-l: calc(var(--base) * 2.618);
        }
        body { background-color: var(--obsidiana-parnasa); background-image: radial-gradient(circle at 2px 2px, rgba(212, 175, 55, 0.05) 1px, transparent 0); background-size: 40px 40px; color: #e2e4e9; font-family: 'Montserrat', sans-serif; margin: 0; line-height: var(--fibo); }
        .header { background: linear-gradient(180deg, #1a1a1c 0%, var(--obsidiana-parnasa) 100%); padding: var(--pad-m) 5%; border-bottom: 2px solid var(--oro-shefa); display: flex; justify-content: space-between; align-items: center; text-transform: uppercase; letter-spacing: 2px; }
        .marca { font-size: 1.5rem; font-weight: 300; }
        .marca .plus { color: var(--oro-shefa); font-weight: 700; }
        .panel-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: var(--pad-m); padding: var(--pad-l) 5%; }
        .modulo { background: var(--titanio-premium); border-radius: 4px; padding: var(--pad-m); border: 1px solid rgba(212, 175, 55, 0.3); box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h2 { color: var(--oro-shefa); font-size: calc(var(--base) * 1.2); margin-top: 0; border-bottom: 1px solid var(--oro-shefa); padding-bottom: var(--pad-s); }
        .calculadora { background: #000; padding: var(--pad-s); display: flex; justify-content: space-between; border-radius: 2px; margin: var(--pad-s) 0; }
        input { background: transparent; border: none; color: var(--oro-shefa); width: 50%; outline: none; font-weight: 600; font-size: 1rem; }
        button { width: 100%; padding: var(--pad-m); background: linear-gradient(135deg, #b8860b, #d4af37); border: none; font-weight: 800; text-transform: uppercase; cursor: pointer; color: #000; transition: transform 0.3s ease; }
        button:hover { transform: scale(1.02); }
        .umbral-parnasa { border-left: 5px solid #fff; }
        .umbral-shefa { border-left: 10px solid var(--oro-shefa); }
        .umbral-veraja { border-left: 15px solid var(--veraja-vital); }
    </style>
</head>
<body>

<header class="header">
    <div class="marca"><span>SHEFÁ</span> <span class="plus">PLUS</span></div>
    <div id="user-info">Verificando Nivel...</div>
</header>

<div class="panel-grid">
    <div class="modulo" id="modulo-inversion">
        <h2>📈 Catálogo RWA Premium</h2>
        <div class="activo"><div style="display: flex; justify-content: space-between;"><span>🌴 Fractional Luxury (Tulum)</span> <span id="apy-tulum-indicador">12% APY</span></div><div class="calculadora"><input type="number" id="inv1" placeholder="Monto (USD)" oninput="calcular(1, window.apyTulumDinamico || 0.12)"><span id="res1" style="color: var(--veraja-vital);"> $0.00 /mes</span></div></div>
        <div class="activo"><div style="display: flex; justify-content: space-between;"><span>☀️ Green Bonds Tokenizados</span> <span id="apy-verde-indicador">8% APY</span></div><div class="calculadora"><input type="number" id="inv2" placeholder="Monto (USD)" oninput="calcular(2, window.apyVerdeDinamico || 0.08)"><span id="res2" style="color: var(--veraja-vital);"> $0.00 /mes</span></div></div>
        <div class="activo"><div style="display: flex; justify-content: space-between;"><span>🚚 Private Debt Logística</span> <span id="apy-logistica-indicador">15% APY</span></div><div class="calculadora"><input type="number" id="inv3" placeholder="Monto (USD)" oninput="calcular(3, window.apyLogisticaDinamico || 0.15)"><span id="res3" style="color: var(--veraja-vital);"> $0.00 /mes</span></div></div>
        
        <button onclick="adquirirCriptofraccion('BRONCE')">BRONCE - $789.787</button>
        <button onclick="adquirirCriptofraccion('PLATA')" style="margin-top:10px;">PLATA - $1.277.875</button>
        <button onclick="adquirirCriptofraccion('ORO')" style="margin-top:10px;">ORO - $2.067.602</button>
    </div>

    <div class="modulo">
        <h2>🌐 Sistema de Remesas Shefá</h2>
        <input type="text" id="beneficiario" placeholder="Nombre del Beneficiario" style="width:100%; padding:10px; margin-bottom:10px; background:#050505; color:#fff; border:1px solid #333;">
        <input type="number" id="montoRemesa" placeholder="Monto (USD)" style="width:100%; padding:10px; margin-bottom:10px; background:#050505; color:#fff; border:1px solid #333;">
        <button onclick="ejecutarRemesa()">EJECUTAR TRANSFERENCIA</button>
    </div>
</div>

<div class="contenedor-bienvenida" style="text-align: center; padding: 20px;">
    <h1>Bienvenido, <span id="displayNombre" style="color: var(--oro-shefa);">Cargando...</span></h1>
    <p>Tu saldo actual es: <span id="displaySaldo" style="color: var(--veraja-vital); font-weight: bold;">0.00</span></p>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAnkRzBz5SbYhRk8Y0irzZA7ujpuy0Dxu4",
        authDomain: "shefa-plus-global.firebaseapp.com",
        databaseURL: "https://shefa-plus-global-default-rtdb.firebaseio.com",
        projectId: "shefa-plus-global",
        storageBucket: "shefa-plus-global.firebasestorage.app",
        messagingSenderId: "746532074927",
        appId: "1:746532074927:web:70811deddc66ad88d5eb5a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);
    const firestore = getFirestore(app);

    // PORTERO DE SEGURIDAD
    onAuthStateChanged(auth, async (user) => {
        if (!user) { window.location.href = "acceso_inversores.html"; }
        else {
            document.getElementById('user-info').innerText = `Inversor: ${user.email}`;
            const docSnap = await getDoc(doc(firestore, "inversores", user.uid));
            if (docSnap.exists()) {
                const data = docSnap.data();
                document.getElementById('displayNombre').innerText = data.nombre;
                document.getElementById('displaySaldo').innerText = data.saldo || "0.00";
            }
        }
    });

    // LÓGICA DE API Y CÁLCULOS
    window.apyLogisticaDinamico = 0.15; window.apyVerdeDinamico = 0.08; window.apyTulumDinamico = 0.12;
    const RAPIDAPI_KEY = "592f8cb99emshd8416dfbfec662ep1cbd7ajsn74b128c5018c";
    
    async function sincronizarMercadoVehiculos() {
        try {
            const resp = await fetch('https://search-auto-values-api.p.rapidapi.com/GetMake', { headers: { 'x-rapidapi-key': RAPIDAPI_KEY } });
            if (resp.ok) { window.apyLogisticaDinamico = 0.162; document.getElementById('apy-logistica-indicador').innerText = "16.2% APY"; }
        } catch(e) { console.log("Oráculo 1 esperando señal"); }
    }
    sincronizarMercadoVehiculos();

    window.calcular = (id, apyBase) => {
        let apy = id === 1 ? window.apyTulumDinamico : (id === 2 ? window.apyVerdeDinamico : window.apyLogisticaDinamico);
        const monto = document.getElementById(`inv${id}`).value || 0;
        document.getElementById(`res${id}`).innerText = `$${((monto * apy) / 12).toFixed(2)} /mes`;
    };

    window.ejecutarRemesa = async () => {
        const nombre = document.getElementById('beneficiario').value;
        const monto = document.getElementById('montoRemesa').value;
        if (!nombre || !monto) return alert("Complete los campos.");
        await push(ref(db, 'remesas/'), { beneficiario: nombre, monto: monto, timestamp: new Date().toISOString() });
        alert("✅ Remesa registrada.");
    };

    window.adquirirCriptofraccion = (nivel) => {
        const links = { 'BRONCE': "https://mpago.li/2H9R7Zo", 'PLATA': "https://mpago.li/1oKzLsK", 'ORO': "https://mpago.li/2tFqSnZ" };
        window.location.href = links[nivel];
    };
</script>
</body>
    </html>
