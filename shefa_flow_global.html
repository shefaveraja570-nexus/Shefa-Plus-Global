<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHEFA FLOW - Red de Expansión Global</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* =========================================================
           👑 NEURO-DISEÑO: ORO PREMIUM & TITANIO AZUL
           ========================================================= */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@300;400;600&display=swap');
        
        body {
            background: linear-gradient(135deg, #0a0e17 0%, #111827 100%);
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .boveda-card {
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(212, 175, 55, 0.1);
            border-radius: 20px;
        }

        .titulo-oro {
            font-family: 'Cinzel', serif;
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0px 2px 4px rgba(0,0,0,0.5);
        }

        .selector-titanio {
            background: #1f2937;
            border: 1px solid #374151;
            color: #e5e7eb;
            transition: all 0.3s ease;
        }
        
        .selector-titanio:focus {
            outline: none;
            border-color: #d4af37;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        /* Botones Asimétricos */
        .btn-web3 {
            background: linear-gradient(90deg, #F3BA2F 0%, #E8B32B 100%);
            color: #000;
            font-weight: 700;
            border-radius: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-web3:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(243, 186, 47, 0.4);
        }

        .btn-fiat {
            background: linear-gradient(90deg, #009EE3 0%, #0088C4 100%);
            color: #fff;
            font-weight: 700;
            border-radius: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-fiat:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 158, 227, 0.4);
        }

        .btn-mastercard {
            background: linear-gradient(90deg, #EB001B 0%, #F79E1B 100%);
            color: #fff;
            font-weight: 700;
            border-radius: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-mastercard:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(235, 0, 27, 0.4);
        }
    </style>
</head>
<body class="p-4">

    <div class="boveda-card w-full max-w-md p-8 relative overflow-hidden">
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-yellow-500 rounded-full mix-blend-multiply filter blur-2xl opacity-20"></div>
        <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-blue-500 rounded-full mix-blend-multiply filter blur-2xl opacity-20"></div>

        <div class="text-center mb-8 relative z-10">
            <h2 class="text-xs tracking-widest text-gray-400 mb-1">PROTOCOLO DE MATERIALIZACIÓN</h2>
            <h1 class="titulo-oro text-3xl font-bold mb-2">SHEFA FLOW</h1>
            <p class="text-sm text-gray-300">Conecta tu coordenada a la red global.</p>
        </div>

        <div class="mb-6 relative z-10">
            <label for="pais-selector" class="block text-xs font-semibold text-gray-400 mb-2 uppercase tracking-wider">Nodo de Origen (23 Países)</label>
            <select id="pais-selector" onchange="enrutarFlujo()" class="selector-titanio w-full p-3 rounded-lg appearance-none cursor-pointer">
                <option value="" disabled selected>Selecciona tu coordenada...</option>
                <option value="LATAM">Argentina</option>
                <option value="LATAM">Brasil</option>
                <option value="LATAM">Chile</option>
                <option value="LATAM">Colombia</option>
                <option value="LATAM">México</option>
                <option value="LATAM">Perú</option>
                <option value="GLOBAL">Alemania</option>
                <option value="GLOBAL">Arabia Saudita</option>
                <option value="GLOBAL">Canadá</option>
                <option value="GLOBAL">China</option>
                <option value="RESTRICTED">Cuba</option>
                <option value="GLOBAL">Ecuador</option>
                <option value="GLOBAL">El Salvador</option>
                <option value="GLOBAL">España</option>
                <option value="GLOBAL">Estados Unidos</option>
                <option value="GLOBAL">Francia</option>
                <option value="GLOBAL">Guatemala</option>
                <option value="GLOBAL">Honduras</option>
                <option value="GLOBAL">Italia</option>
                <option value="GLOBAL">Noruega</option>
                <option value="GLOBAL">Puerto Rico</option>
                <option value="GLOBAL">República Dominicana</option>
                <option value="RESTRICTED">Rusia</option>
            </select>
        </div>

        <div id="panel-monto" class="mb-6 relative z-10 hidden">
            <label for="input-monto" class="block text-xs font-semibold text-gray-400 mb-2 uppercase tracking-wider">Frecuencia de Inyección (USDT/USD)</label>
            <div class="relative">
                <span class="absolute left-4 top-3 text-yellow-500 font-bold">$</span>
                <input type="number" id="input-monto" placeholder="Ej: 500" class="selector-titanio w-full p-3 pl-8 rounded-lg outline-none font-bold text-white shadow-inner">
            </div>
        </div>

        <div id="panel-canales" class="space-y-4 hidden relative z-10">
            
            <button id="canal-web3" onclick="iniciarPagoWeb3()" class="btn-web3 w-full py-4 flex items-center justify-center gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"/><line x1="12" y1="22" x2="12" y2="15.5"/><polyline points="22 8.5 12 15.5 2 8.5"/><polyline points="2 15.5 12 8.5 22 15.5"/><line x1="12" y1="2" x2="12" y2="8.5"/></svg>
                INYECCIÓN WEB3 (BNB / USDT)
            </button>

            <button id="canal-mercadopago" onclick="iniciarPagoFiat('MercadoPago')" class="btn-fiat w-full py-4 flex items-center justify-center gap-3 hidden">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
                MERCADO PAGO (Local)
            </button>

            <button id="canal-mastercard" onclick="iniciarPagoFiat('Mastercard_Internacional')" class="btn-mastercard w-full py-4 flex items-center justify-center gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="12" r="5"/><circle cx="16" cy="12" r="5"/></svg>
                MASTERCARD / VISA INT.
            </button>
        </div>
        
        <p id="mensaje-enrutamiento" class="text-xs text-center text-gray-400 mt-6 hidden">
            El Río de Luz fluye bajo la proporción áurea (3.68%).
        </p>
        
        <input type="hidden" id="metodo-pago" value="">
        <div id="display-tarifa" style="display:none;"></div>
        <div id="display-total" style="display:none;"></div>

    </div>

    <script type="module" src="./caja_cuantica.js"></script>

    <script>
        // 1. Mostrar paneles según el país
        function enrutarFlujo() {
            const selector = document.getElementById('pais-selector');
            const zona = selector.value;
            const paisNombre = selector.options[selector.selectedIndex].text;
            
            const panelMontos = document.getElementById('panel-monto');
            const panelCanales = document.getElementById('panel-canales');
            const btnMP = document.getElementById('canal-mercadopago');
            const btnMaster = document.getElementById('canal-mastercard');
            const mensaje = document.getElementById('mensaje-enrutamiento');

            panelMontos.classList.remove('hidden');
            panelCanales.classList.remove('hidden');
            mensaje.classList.remove('hidden');

            if (zona === 'LATAM') {
                btnMP.classList.remove('hidden');
                mensaje.innerText = `Nodo ${paisNombre} conectado. Canales locales e internacionales abiertos.`;
            } else if (zona === 'GLOBAL') {
                btnMP.classList.add('hidden');
                mensaje.innerText = `Nodo ${paisNombre} conectado. Conectando a pasarelas globales e inyección Web3.`;
            } else if (zona === 'RESTRICTED') {
                btnMP.classList.add('hidden');
                btnMaster.classList.add('hidden');
                mensaje.innerText = `Nodo ${paisNombre} detectado. Protocolo descentralizado Web3 activado para evasión de fricción Fiat.`;
            }
        }

        // 2. Ejecutar Inyección Cripto (Web3)
        function iniciarPagoWeb3() {
            const monto = document.getElementById('input-monto').value;
            if (!monto || monto <= 0) {
                alert("👑 BÓVEDA SHEFA:\n\nIngresa una frecuencia (Monto) válida de Oro Puro para continuar.");
                return;
            }
            // Invocamos la función maestra de tu archivo caja_cuantica.js
            if(window.procesarPagoWeb3) {
                // Simulamos un hash de transacción por ahora, luego se conectará a MetaMask real
                const hashSimulado = "0x" + Math.random().toString(36).substring(2, 15);
                window.procesarPagoWeb3(monto, hashSimulado);
            } else {
                alert("Fricción: El motor Web3 de Titanio Azul aún no ha cargado. Espera un segundo.");
            }
        }

        // 3. Ejecutar Inyección Tradicional (Fiat)
        function iniciarPagoFiat(metodoSeleccionado) {
            const monto = document.getElementById('input-monto').value;
            if (!monto || monto <= 0) {
                alert("👑 BÓVEDA SHEFA:\n\nIngresa una frecuencia (Monto) válida de Oro Puro para continuar.");
                return;
            }
            // Seteamos el método oculto para que la caja_cuantica lo lea
            document.getElementById('metodo-pago').value = metodoSeleccionado;
            
            // Invocamos la función maestra de tu archivo caja_cuantica.js
            if(window.ejecutarTransmision) {
                window.ejecutarTransmision();
            } else {
                alert("Fricción: El motor Fiat de Titanio Azul aún no ha cargado. Espera un segundo.");
            }
        }
    </script>
</body>
</html>
                                                   </html>
