<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motor Jojmá | Shefá Plus Global</title>
    <script src="https://kit.fontawesome.com/tu-codigo-font-awesome.js" crossorigin="anonymous"></script>
    <style>
        /* ======================================================= */
        /* ESTILOS DEL NÚCLEO ENERGÉTICO                           */
        /* ======================================================= */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050b14; /* El Abismo */
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #lienzo-ancestral {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .matriz-central {
            position: relative;
            z-index: 2;
            text-align: center;
            background: rgba(17, 31, 56, 0.7);
            backdrop-filter: blur(12px);
            padding: 55px;
            border-radius: 21px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            box-shadow: 0 0 55px rgba(255, 85, 0, 0.2);
            transition: transform 0.618s ease;
        }

        .matriz-central:hover {
            transform: scale(1.02);
            box-shadow: 0 0 89px rgba(255, 85, 0, 0.4);
        }

        .icono-llama {
            font-size: 4rem;
            color: #ff5500;
            text-shadow: 0 0 21px rgba(255, 85, 0, 0.8);
            margin-bottom: 21px;
            animation: pulso-divino 1.618s infinite alternate;
        }

        .titulo-matriz {
            color: #ffffff;
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 13px;
        }

        .subtitulo-frecuencia {
            color: #d4af37;
            font-size: 1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 34px;
        }

        .etiquetas-valores {
            display: flex;
            gap: 13px;
            justify-content: center;
        }

        .etiqueta {
            background: rgba(5, 11, 20, 0.8);
            color: #94a3b8;
            padding: 8px 13px;
            border-radius: 8px;
            font-size: 0.8rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @keyframes pulso-divino {
            0% { transform: scale(1); filter: brightness(1); }
            100% { transform: scale(1.1); filter: brightness(1.3); }
        }
    </style>
</head>
<body>

    <canvas id="lienzo-ancestral"></canvas>

    <div class="matriz-central">
        <i class="fas fa-fire icono-llama"></i>
        <h1 class="titulo-matriz">Conexión Segura</h1>
        <p class="subtitulo-frecuencia">Iniciando el Santuario de Comunicación</p>
        
        <div class="etiquetas-valores">
            <span class="etiqueta">Parnasá</span>
            <span class="etiqueta">Shefá</span>
            <span class="etiqueta">Verajá</span>
            <span class="etiqueta">Jojmá</span>
            <span class="etiqueta">Emuná</span>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('lienzo-ancestral');
        const ctx = canvas.getContext('2d');
        let particulas = [];

        // Ajustar el lienzo al tamaño de la pantalla
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Clase Arquitectónica de la Partícula de Fuego
        class ParticulaFuego {
            constructor() {
                this.x = canvas.width / 2 + (Math.random() * 100 - 50);
                this.y = canvas.height; // Nacen desde el fondo
                this.tamaño = Math.random() * 8 + 2;
                this.velocidadX = Math.random() * 3 - 1.5;
                this.velocidadY = Math.random() * 5 + 2;
                this.vida = 1.0;
                // Colores del fuego: Naranja, Rojo, Amarillo brillante
                this.color = `rgba(255, ${Math.floor(Math.random() * 150 + 50)}, 0, ${this.vida})`;
            }

            actualizar() {
                this.x += this.velocidadX;
                this.y -= this.velocidadY; // Suben como el calor
                this.vida -= 0.015; // Se consumen lentamente
                this.tamaño *= 0.95; // Se hacen pequeñas al subir
                this.color = `rgba(255, ${Math.floor(Math.random() * 150 + 50)}, 0, ${this.vida})`;
            }

            dibujar() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.tamaño, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Bucle Cuántico de Renderizado
        function animarFuego() {
            // Un fondo ligeramente transparente para dejar una estela (efecto llama)
            ctx.fillStyle = 'rgba(5, 11, 20, 0.2)'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Inyectar nuevas partículas en cada ciclo
            if (particulas.length < 150) {
                particulas.push(new ParticulaFuego());
                particulas.push(new ParticulaFuego());
            }

            for (let i = 0; i < particulas.length; i++) {
                particulas[i].actualizar();
                particulas[i].dibujar();

                // Eliminar partículas que ya se consumieron
                if (particulas[i].vida <= 0 || particulas[i].tamaño <= 0.5) {
                    particulas.splice(i, 1);
                    i--;
                }
            }
            requestAnimationFrame(animarFuego);
        }

        // Encender el motor
        animarFuego();
    </script>
</body>
  </html>
