<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shefa Nexus | Red Global de Valor</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dorado: '#D4AF37',
                        doradoOscuro: '#AA841B',
                        titanio: '#0a1128',
                        abismo: '#050814',
                        panelGris: '#12182b'
                    }
                }
            }
        }
    </script>
    
    <style>
        body { 
            background-color: #050814; 
            font-family: 'Inter', system-ui, sans-serif; 
            -webkit-font-smoothing: antialiased; 
            overflow: hidden; 
        }
        .borde-dorado-sutil { border: 1px solid rgba(212, 175, 55, 0.2); }
        .glow-dorado { box-shadow: 0 0 15px rgba(212, 175, 55, 0.3); }
        .glow-dorado-intenso { box-shadow: 0 0 30px rgba(212, 175, 55, 0.6); }
        .texto-gradiente {
            background: linear-gradient(90deg, #d4af37, #fdf5a9, #d4af37);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #050814; }
        ::-webkit-scrollbar-thumb { background: #D4AF37; border-radius: 10px; }
        
        @keyframes latido-shefa {
            0% { transform: scale(1); box-shadow: 0 0 15px rgba(212, 175, 55, 0.3); }
            50% { transform: scale(1.02); box-shadow: 0 0 25px rgba(212, 175, 55, 0.6); }
            100% { transform: scale(1); box-shadow: 0 0 15px rgba(212, 175, 55, 0.3); }
        }
        .latido-activo { animation: latido-shefa 2s infinite; }
    </style>
</head>
<body class="text-gray-300 h-screen flex flex-col selection:bg-dorado selection:text-black relative">

    <audio id="audio-ping" src="https://assets.mixkit.co/active_storage/sfx/2190/2190-preview.mp3" preload="auto"></audio>

    <div id="pantalla-login" class="fixed inset-0 bg-abismo z-[100] flex flex-col items-center justify-center p-4">
        <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-10"></div>
        <div class="bg-titanio border border-dorado/30 p-8 rounded-2xl shadow-[0_0_50px_rgba(212,175,55,0.2)] w-full max-w-md relative z-10 text-center">
            <div class="w-20 h-20 mx-auto rounded-full border-2 border-dorado flex items-center justify-center bg-black glow-dorado mb-6">
                <i class="fas fa-fingerprint text-3xl text-dorado"></i>
            </div>
            <h2 class="text-2xl font-black text-white uppercase tracking-widest texto-gradiente mb-2">Shefa Nexus</h2>
            <p class="text-sm text-gray-400 mb-8 uppercase tracking-widest">Santuario Encriptado</p>
            
            <input type="email" id="login-email" placeholder="Correo de la Bóveda" class="w-full bg-black border border-gray-700 text-white rounded-lg p-3 mb-4 focus:border-dorado focus:outline-none transition-colors text-center">
            <input type="password" id="login-password" placeholder="Clave de Titanio" class="w-full bg-black border border-gray-700 text-white rounded-lg p-3 mb-6 focus:border-dorado focus:outline-none transition-colors text-center">
            
            <button id="btn-login" class="w-full bg-gradient-to-r from-dorado to-doradoOscuro text-black font-black uppercase tracking-widest py-3 rounded-lg hover:opacity-90 transition shadow-lg glow-dorado flex justify-center items-center gap-2">
                <i class="fas fa-lock-open"></i> Desbloquear Bóveda
            </button>
            <p id="login-error" class="text-red-500 text-xs mt-4 hidden">Frecuencia denegada. Verifica tus credenciales.</p>
        </div>
    </div>

    <div id="interfaz-principal" class="hidden flex-col h-full w-full">
        
        <header class="bg-titanio border-b border-dorado/20 p-3 md:p-4 flex flex-col md:flex-row justify-between items-center gap-3 z-40 shrink-0 shadow-[0_4px_20px_rgba(0,0,0,0.5)]">
            <div class="w-full flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <a href="umbral.html" class="text-dorado hover:text-white transition-colors">
                        <i class="fas fa-arrow-left text-lg"></i>
                    </a>
                    <div class="flex items-center gap-2">
                        <div class="w-8 h-8 rounded-full border border-dorado flex items-center justify-center bg-black glow-dorado">
                            <i class="fas fa-network-wired text-dorado text-xs"></i>
                        </div>
                        <div>
                            <h1 class="text-white font-black tracking-widest uppercase text-xs md:text-sm texto-gradiente">Shefa Nexus</h1>
                            <p class="text-[0.55rem] text-gray-400 tracking-[0.2em] uppercase" id="estado-red">Conectando... 🟡</p>
                        </div>
                    </div>
                </div>
                <button onclick="cerrarBoveda()" class="text-gray-500 hover:text-red-500 transition text-[0.6rem] uppercase tracking-widest font-bold">
                    <i class="fas fa-sign-out-alt"></i> Salir
                </button>
            </div>
        </header>

        <main class="flex-grow flex overflow-hidden">
            <section class="w-full flex flex-col bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] bg-titanio/10 relative">
                
                <div class="bg-panelGris border-b border-gray-800 p-3 flex justify-between items-center shrink-0">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-dorado to-black flex items-center justify-center shadow-lg border border-dorado">
                            <i class="fas fa-star text-dorado"></i>
                        </div>
                        <div>
                            <h2 class="text-white font-bold tracking-wide" id="nombre-contacto-chat">Sincronizando...</h2>
                            <span class="text-[0.65rem] text-dorado uppercase tracking-widest">Enlace Encriptado bajo Verajá</span>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button class="bg-black border border-dorado text-dorado px-3 py-1.5 rounded hover:bg-dorado hover:text-black transition flex items-center gap-2 text-xs font-bold uppercase tracking-widest">
                            <i class="fas fa-paper-plane"></i> <span class="hidden sm:inline">Remesa</span>
                        </button>
                    </div>
                </div>

                <div class="flex-grow overflow-y-auto p-4 flex flex-col gap-4" id="matriz-mensajes">
                    </div>

                <div class="bg-abismo border-t border-gray-800 p-3 shrink-0">
                    <div class="flex items-end gap-2 bg-panelGris border border-gray-700 rounded-xl p-1 focus-within:border-dorado transition-colors">
                        <button class="p-3 text-gray-400 hover:text-dorado transition shrink-0"><i class="fas fa-plus-circle text-lg"></i></button>
                        <textarea id="input-mensaje" rows="1" class="w-full bg-transparent text-white text-sm outline-none resize-none py-3 placeholder-gray-500 font-sans" placeholder="Transmite tu frecuencia..."></textarea>
                        <div class="flex gap-1 shrink-0 pb-1 pr-1">
                            <button class="p-2 bg-dorado text-black rounded-lg hover:bg-white transition shadow-lg glow-dorado w-10 h-10 flex items-center justify-center" onclick="transmitirMensajeUI()">
                                <i class="fas fa-paper-plane"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // ⚡ TUS LLAVES MAESTRAS ⚡
        const firebaseConfig = {
            apiKey: "AIzaSyAnkRzBz5SbYhRk8Y0irzZA7ujpuy0Dxu4",
            authDomain: "shefa-plus-global.firebaseapp.com",
            databaseURL: "https://shefa-plus-global-default-rtdb.firebaseio.com",
            projectId: "shefa-plus-global",
            storageBucket: "shefa-plus-global.firebasestorage.app",
            messagingSenderId: "746532074927",
            appId: "1:746532074927:web:70811deddc66ad88d5eb5a",
            measurementId: "G-ELXBWZJZD8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // --- MAPA DE IDENTIDADES ---
        const identidades = {
            "magneticoelectro310@gmail.com": "Magnético",
            "medinalj96@gmail.com": "Amor Mío ✨"
        };

        let nodoActual = "";
        let nodoDestino = "";
        let mensajesVistos = new Set(); // Para no sonar el ping con mensajes viejos

        // --- SOLICITAR PERMISO DE NOTIFICACIONES ---
        if ("Notification" in window) {
            Notification.requestPermission();
        }

        // --- SISTEMA DE AUTENTICACIÓN ---
        const pantallaLogin = document.getElementById('pantalla-login');
        const interfazPrincipal = document.getElementById('interfaz-principal');

        onAuthStateChanged(auth, (user) => {
            if (user && identidades[user.email]) {
                // Autenticado correctamente
                nodoActual = identidades[user.email];
                nodoDestino = (nodoActual === "Magnético") ? "Amor Mío ✨" : "Magnético";
                
                document.getElementById('estado-red').innerText = `Operando como: ${nodoActual} 🟢`;
                document.getElementById('nombre-contacto-chat').innerText = nodoDestino;
                
                pantallaLogin.classList.add('hidden');
                interfazPrincipal.classList.remove('hidden');
                interfazPrincipal.classList.add('flex');
                
                iniciarEscuchaMatriz();
            } else {
                // No autenticado o intruso
                pantallaLogin.classList.remove('hidden');
                interfazPrincipal.classList.add('hidden');
                interfazPrincipal.classList.remove('flex');
                if (user) signOut(auth); // Expulsar si no está en la lista dorada
            }
        });

        // Botón Desbloquear Bóveda
        document.getElementById('btn-login').addEventListener('click', async () => {
            const email = document.getElementById('login-email').value.trim();
            const pass = document.getElementById('login-password').value;
            const btn = document.getElementById('btn-login');
            const errorMsg = document.getElementById('login-error');
            
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Verificando...';
            errorMsg.classList.add('hidden');

            try {
                await signInWithEmailAndPassword(auth, email, pass);
                btn.innerHTML = '<i class="fas fa-lock-open"></i> Desbloquear Bóveda';
            } catch (error) {
                btn.innerHTML = '<i class="fas fa-lock-open"></i> Desbloquear Bóveda';
                errorMsg.classList.remove('hidden');
            }
        });

        window.cerrarBoveda = function() {
            signOut(auth);
        };

        // --- LÓGICA DEL CHAT Y NOTIFICACIONES ---
        const textarea = document.getElementById('input-mensaje');
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        window.transmitirMensajeUI = async function() {
            const texto = textarea.value.trim();
            if(texto === "") return;

            await addDoc(collection(db, "mensajes_nexus"), {
                emisor: nodoActual,
                receptor: nodoDestino,
                texto: texto,
                timestamp: serverTimestamp()
            });
            textarea.value = '';
            textarea.style.height = 'auto';
        };

        function iniciarEscuchaMatriz() {
            const q = query(collection(db, "mensajes_nexus"), orderBy("timestamp", "asc"));
            
            onSnapshot(q, (snapshot) => {
                const contenedor = document.getElementById('matriz-mensajes');
                
                snapshot.docChanges().forEach((change) => {
                    if (change.type === "added") {
                        const datos = change.doc.data();
                        const docId = change.doc.id;

                        // Filtro de canal privado
                        if ((datos.emisor === nodoActual && datos.receptor === nodoDestino) || 
                            (datos.emisor === nodoDestino && datos.receptor === nodoActual)) {
                            
                            const esMio = datos.emisor === nodoActual;
                            
                            // PING Y NOTIFICACIÓN (Solo si el mensaje es de la otra persona y es nuevo)
                            if (!esMio && !mensajesVistos.has(docId)) {
                                document.getElementById('audio-ping').play().catch(e => console.log("Audio bloqueado por navegador hasta interacción"));
                                
                                if (Notification.permission === "granted" && document.hidden) {
                                    new Notification(`Nuevo mensaje de ${datos.emisor}`, {
                                        body: datos.texto,
                                        icon: "logo-shefa.png" // Asegúrate de tener este logo
                                    });
                                }
                            }
                            mensajesVistos.add(docId);

                            // DIBUJAR BURBUJA
                            const htmlMensaje = esMio ? `
                                <div class="flex flex-col items-end max-w-[85%] sm:max-w-[70%] self-end mt-2">
                                    <div class="bg-gradient-to-br from-titanio to-black border border-dorado/30 text-white p-3 rounded-2xl rounded-tr-none shadow-[0_0_15px_rgba(212,175,55,0.15)]">
                                        <p class="text-sm leading-relaxed">${datos.texto}</p>
                                    </div>
                                </div>
                            ` : `
                                <div class="flex flex-col items-start max-w-[85%] sm:max-w-[70%] mt-2">
                                    <div class="bg-panelGris border border-gray-700 text-gray-200 p-3 rounded-2xl rounded-tl-none shadow-md">
                                        <p class="text-sm leading-relaxed">${datos.texto}</p>
                                    </div>
                                </div>
                            `;
                            contenedor.insertAdjacentHTML('beforeend', htmlMensaje);
                        }
                    }
                });
                contenedor.scrollTop = contenedor.scrollHeight;
            });
        }
    </script>
</body>
    </html>
