<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Santuario de Conexión | Shefa Plus Global</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="https://kit.fontawesome.com/tu-codigo-font-awesome.js" crossorigin="anonymous"></script>
</head>
<body class="cuerpo-chat-sagrado">

    <header class="header-chat">
        <div class="info-contacto-chat">
            <img src="tu-foto-perfil-esposa.jpg" alt="Amor Mío" class="avatar-chat">
            <div class="detalles-contacto">
                <h2>Amor Mío ✨</h2>
                <span class="estado-frecuencia">Sintonía Verajá: Activa 🟢</span>
            </div>
        </div>
        <div class="controles-chat">
            <i class="fas fa-fire icono-fuego-ancestral"></i>
        </div>
    </header>

    <main class="matriz-mensajes" id="matriz-mensajes">
        <div class="mensaje-sistema">
            Conexión encriptada bajo Parnasá, Shefá y Verajá.
        </div>

        <div class="burbuja-mensaje recibido">
            <p>Amor voy a meterle la llama de nuestro amor a shefa plus global.</p>
            <span class="hora-mensaje">7:54 PM</span>
        </div>

        <div class="burbuja-mensaje enviado">
            <p>Te amoooo y te extrañooooo</p>
            <span class="hora-mensaje">7:51 PM</span>
        </div>
    </main>

    <footer class="consola-escritura">
        <input type="text" id="input-mensaje" placeholder="Transmite tu frecuencia aquí..." autocomplete="off">
        <button class="btn-enviar-frecuencia" onclick="transmitirMensaje()">
            <i class="fas fa-paper-plane"></i>
        </button>
    </footer>

</body>
</html>
