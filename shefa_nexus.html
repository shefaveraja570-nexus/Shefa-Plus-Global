<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shefa Nexus | Red Social de Valor</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dorado: '#D4AF37',
                        verdeVeraja: '#10B981',
                        titanio: '#0a1128',
                        abismo: '#050814',
                        panelGris: '#12182b'
                    }
                }
            }
        }
    </script>
    
    <style>
        body { 
            background-color: #050814; 
            font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; 
            -webkit-font-smoothing: antialiased; 
            overflow: hidden; /* Evita el scroll global, lo manejan los contenedores */
        }
        
        .borde-dorado-sutil { border: 1px solid rgba(212, 175, 55, 0.2); }
        .glow-dorado { box-shadow: 0 0 15px rgba(212, 175, 55, 0.3); }
        
        /* Efecto Berajá UI */
        .tarjeta-nexus {
            background: linear-gradient(145deg, #0a1128, #050814);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .texto-gradiente {
            background: linear-gradient(90deg, #d4af37, #10B981, #d4af37);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Scrollbars Premium */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #050814; }
        ::-webkit-scrollbar-thumb { background: #D4AF37; border-radius: 10px; }

        /* Navegación Inferior */
        .nav-item {
            color: #4a5568;
            transition: all 0.3s ease;
            position: relative;
        }
        .nav-item.activo {
            color: #D4AF37;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }
        .nav-item.activo::after {
            content: '';
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 3px;
            background: #D4AF37;
            border-radius: 0 0 4px 4px;
            box-shadow: 0 2px 5px rgba(212, 175, 55, 0.5);
        }
    </style>
</head>
<body class="text-gray-300 h-screen flex flex-col selection:bg-dorado selection:text-black">

    <audio id="audio-ping" src="https://assets.mixkit.co/active_storage/sfx/2190/2190-preview.mp3" preload="auto"></audio>

    <header class="bg-titanio border-b border-dorado/20 p-3 flex justify-between items-center z-40 shrink-0 shadow-[0_4px_20px_rgba(0,0,0,0.5)]">
        <div class="flex items-center gap-3">
            <a href="umbral.html" class="text-dorado hover:text-white transition-colors">
                <i class="fas fa-arrow-left text-lg"></i>
            </a>
            <div class="flex items-center gap-2">
                <img src="logo-shefa.png" alt="Ojo" class="w-8 h-8 rounded-full border border-dorado glow-dorado object-cover" onerror="this.src='https://via.placeholder.com/150/000000/d4af37?text=O'">
                <div>
                    <h1 class="font-black tracking-widest uppercase text-xs sm:text-sm texto-gradiente">Shefa Nexus</h1>
                    <p class="text-[0.55rem] text-gray-400 tracking-[0.2em] uppercase" id="estado-red">Conectando a la Matriz...</p>
                </div>
            </div>
        </div>
        <button onclick="cerrarBoveda()" class="text-gray-500 hover:text-dorado transition text-[0.6rem] uppercase tracking-widest font-bold border border-gray-700 px-2 py-1 rounded">
            <i class="fas fa-sign-out-alt"></i> Salir
        </button>
    </header>

    <main class="flex-grow overflow-hidden relative">
        
        <section id="vista-muro" class="absolute inset-0 overflow-y-auto bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] bg-abismo/80 p-4 pb-24">
            
            <div class="tarjeta-nexus p-4 mb-6">
                <div class="flex gap-3">
                    <img id="muro-mi-foto" src="https://via.placeholder.com/150/12182b/d4af37?text=U" class="w-10 h-10 rounded-full border border-dorado object-cover">
                    <textarea id="input-publicacion" rows="2" class="w-full bg-transparent text-white text-sm outline-none resize-none placeholder-gray-500" placeholder="Comparte abundancia, Parnasá o noticias corporativas..."></textarea>
                </div>
                <div class="flex justify-between items-center mt-3 border-t border-gray-800 pt-3">
                    <div class="flex gap-3">
                        <button class="text-gray-400 hover:text-dorado transition"><i class="fas fa-image"></i></button>
                        <button class="text-gray-400 hover:text-verdeVeraja transition"><i class="fas fa-chart-line"></i></button>
                    </div>
                    <button onclick="publicarEnMuro()" class="bg-gradient-to-r from-dorado to-doradoOscuro text-black text-xs font-bold uppercase tracking-widest px-4 py-1.5 rounded hover:opacity-90 transition glow-dorado">
                        Publicar
                    </button>
                </div>
            </div>

            <div id="feed-muro" class="flex flex-col gap-4">
                <div class="text-center text-dorado text-xs tracking-widest mt-10"><i class="fas fa-circle-notch fa-spin"></i> Sincronizando Matriz...</div>
            </div>
        </section>

        <section id="vista-chats" class="absolute inset-0 overflow-y-auto bg-abismo p-2 pb-24 hidden">
            <div class="p-2">
                <h2 class="text-dorado text-xs font-bold uppercase tracking-widest mb-4 border-b border-gray-800 pb-2">Conexiones Privadas</h2>
                <div id="lista-usuarios-chat" class="flex flex-col gap-2">
                    </div>
            </div>
        </section>

        <section id="vista-chat-activo" class="absolute inset-0 bg-titanio z-50 flex flex-col hidden transform transition-transform translate-x-full">
            <div class="bg-panelGris border-b border-gray-800 p-3 flex justify-between items-center shrink-0">
                <div class="flex items-center gap-3">
                    <button onclick="volverAListaChats()" class="text-dorado hover:text-white p-2"><i class="fas fa-chevron-left"></i></button>
                    <img id="chat-foto-destino" src="https://via.placeholder.com/150" class="w-9 h-9 rounded-full border border-dorado object-cover">
                    <div>
                        <h2 class="text-white font-bold text-sm tracking-wide" id="chat-nombre-destino">Usuario</h2>
                        <span class="text-[0.55rem] text-verdeVeraja uppercase tracking-widest"><i class="fas fa-lock"></i> Encriptado</span>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button onclick="abrirRemesaWeb3()" class="bg-black border border-dorado text-dorado w-8 h-8 rounded hover:bg-dorado hover:text-black transition flex items-center justify-center glow-dorado">
                        <i class="fab fa-bnb"></i>
                    </button>
                    <button onclick="abrirRemesaMP()" class="bg-[#009ee3] border border-[#009ee3] text-white w-8 h-8 rounded hover:bg-white hover:text-[#009ee3] transition flex items-center justify-center shadow-lg">
                        <i class="fas fa-handshake"></i>
                    </button>
                </div>
            </div>

            <div id="matriz-mensajes-privados" class="flex-grow overflow-y-auto p-4 flex flex-col gap-3 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] bg-abismo/50">
                </div>

            <div class="bg-abismo border-t border-gray-800 p-3 shrink-0">
                <div class="flex items-end gap-2 bg-panelGris border border-gray-700 rounded-xl p-1 focus-within:border-dorado transition-colors">
                    <textarea id="input-mensaje-privado" rows="1" class="w-full bg-transparent text-white text-sm outline-none resize-none py-3 px-3 placeholder-gray-500" placeholder="Transmite frecuencia..."></textarea>
                    <button onclick="enviarMensajePrivado()" class="p-2 bg-dorado text-black rounded-lg hover:bg-white transition glow-dorado w-10 h-10 flex items-center justify-center mb-1 mr-1">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </section>

    </main>

    <nav class="bg-panelGris border-t border-dorado/30 h-16 flex justify-around items-center shrink-0 shadow-[0_-5px_20px_rgba(0,0,0,0.5)] z-40 fixed bottom-0 w-full">
        <button onclick="cambiarVista('muro')" id="nav-muro" class="nav-item activo flex flex-col items-center w-1/3">
            <i class="fas fa-globe text-xl mb-1"></i>
            <span class="text-[0.6rem] uppercase tracking-widest font-bold">Registro Civil</span>
        </button>
        <button onclick="cambiarVista('chats')" id="nav-chats" class="nav-item flex flex-col items-center w-1/3">
            <div class="relative">
                <i class="fas fa-comment-alt text-xl mb-1"></i>
                <span class="absolute -top-1 -right-2 bg-red-500 text-white text-[0.5rem] px-1 rounded-full border border-panelGris hidden" id="badge-mensajes">0</span>
            </div>
            <span class="text-[0.6rem] uppercase tracking-widest font-bold">Nexus Chat</span>
        </button>
        <button onclick="cambiarVista('perfil')" id="nav-perfil" class="nav-item flex flex-col items-center w-1/3">
            <i class="fas fa-fingerprint text-xl mb-1"></i>
            <span class="text-[0.6rem] uppercase tracking-widest font-bold">Matriz (Perfil)</span>
        </button>
    </nav>
<script type="module" src="nexus_core.js"></script>


    </script>
</body>
</html
