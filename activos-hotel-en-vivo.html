<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activos en Vivo | Central Park</title>
    <style>
        :root { 
            --sacred-gold: #D4AF37; 
            --cosmic-navy: #1877F2; 
            --titanium: #1A1A1A; 
            --bg-deep: #0A0A0A; 
        }
        body { background: var(--bg-deep); color: #fff; font-family: 'Inter', sans-serif; padding: 21px; margin: 0; }
        .container { max-width: 1200px; margin: auto; }
        
        /* Layout Asimétrico y Disruptivo */
        .grid-assets { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); 
            gap: 34px; 
        }

        .hab-card {
            background: var(--titanium);
            border: 2px solid var(--sacred-gold);
            border-radius: 21px 55px 21px 55px; /* Asimetría Fibonacci */
            padding: 34px;
            transition: transform 0.3s ease;
        }
        .hab-card:hover { transform: translateY(-10px); }

        .gallery-container {
            display: flex;
            gap: 13px;
            overflow-x: auto;
            margin: 21px 0;
            padding-bottom: 10px;
            scrollbar-width: thin;
            scrollbar-color: var(--sacred-gold) var(--titanium);
        }
        .gallery-container img {
            width: 150px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid var(--cosmic-navy);
        }

        .precio { font-size: 24px; color: var(--sacred-gold); font-weight: bold; margin: 13px 0; display: block; }
        .btn-reserva {
            background: transparent;
            color: var(--sacred-gold);
            border: 2px solid var(--sacred-gold);
            padding: 13px 21px;
            border-radius: 34px;
            cursor: pointer;
            width: 100%;
            font-weight: 800;
            text-transform: uppercase;
        }
        .btn-reserva:hover { background: var(--sacred-gold); color: #000; }
    </style>
</head>
<body>

<div class="container">
    <h1 style="text-align: center; color: var(--sacred-gold);">🏛️ ACTIVOS CENTRAL PARK</h1>
    <div id="lista-habitaciones" class="grid-assets"></div>
</div>

<script>
    // Data maestra con 10 habitaciones
    const habitaciones = Array.from({ length: 10 }, (_, i) => ({
        id: 101 + i,
        tipo: i % 2 === 0 ? "Suite Ejecutiva" : "Habitación Confort",
        precio: (90 + (i * 10)) + ".000",
        fotos: Array(10).fill("https://via.placeholder.com/150x100?text=Habitacion+Foto")
    }));

    const contenedor = document.getElementById('lista-habitaciones');

    habitaciones.forEach(hab => {
        const fotosHTML = hab.fotos.map(foto => `<img src="${foto}" loading="lazy" alt="Foto Habitación">`).join('');
        
        contenedor.innerHTML += `
            <div class="hab-card">
                <h3>Habitación ${hab.id} | ${hab.tipo}</h3>
                <div class="gallery-container">${fotosHTML}</div>
                <span class="precio">$ ${hab.precio} COP</span>
                <button class="btn-reserva" onclick="pagar('${hab.id}', '${hab.precio}')">🛎️ RESERVAR AHORA</button>
            </div>
        `;
    });

    function pagar(id, precio) {
        window.open(`https://wa.me/573118582529?text=Hola, quiero reservar la Habitación ${id} por $${precio}.`, '_blank');
    }
</script>
</body>
</html>
