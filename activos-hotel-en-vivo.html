<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Central Park | Gestión Visual</title>
    <style>
        :root { --fib-gold: #D4AF37; --bg-main: #0a0a0a; }
        body { background: var(--bg-main); color: #fff; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .container { max-width: 600px; margin: auto; }
        
        .hab-card {
            background: #151515;
            border: 1px solid var(--fib-gold);
            border-radius: 21px;
            padding: 21px;
            margin-bottom: 34px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* Contenedor de fotos (Scroll Horizontal) */
        .gallery-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            margin: 15px 0;
            padding-bottom: 10px;
        }
        .gallery-container img {
            width: 120px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid var(--fib-gold);
        }

        .info-row { display: flex; justify-content: space-between; align-items: center; }
        .precio { font-size: 20px; color: var(--fib-gold); font-weight: bold; }
        .btn-reserva {
            background: transparent;
            color: var(--fib-gold);
            border: 2px solid var(--fib-gold);
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-reserva:hover { background: var(--fib-gold); color: #000; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align:center; color:var(--fib-gold);">🛎️ Hotel Central Park</h2>
    <div id="lista-habitaciones"></div>
</div>

<script>
    // Ahora cada habitación tiene su array de fotos
    const habitaciones = [
        { 
            id: "101", tipo: "Suite Ejecutiva", precio: "150.000", 
            fotos: ["https://via.placeholder.com/120x80", "https://via.placeholder.com/120x80"] 
        },
        { 
            id: "102", tipo: "Habitación Doble", precio: "120.000", 
            fotos: ["https://via.placeholder.com/120x80", "https://via.placeholder.com/120x80"] 
        }
    ];

    const contenedor = document.getElementById('lista-habitaciones');

    habitaciones.forEach(hab => {
        let fotosHTML = hab.fotos.map(foto => `<img src="${foto}" alt="Habitación">`).join('');
        
        contenedor.innerHTML += `
            <div class="hab-card">
                <h3>${hab.id} - ${hab.tipo}</h3>
                <div class="gallery-container">${fotosHTML}</div>
                <div class="info-row">
                    <span class="precio">$ ${hab.precio} COP</span>
                    <button class="btn-reserva" onclick="pagar('${hab.id}', '${hab.precio}')">🛎️ Reservar</button>
                </div>
            </div>
        `;
    });

    function pagar(id, precio) {
        window.open(`https://wa.me/573118582529?text=Hola, quiero reservar la Habitación ${id} de $${precio}.`, '_blank');
    }
</script>
</body>
</html>
