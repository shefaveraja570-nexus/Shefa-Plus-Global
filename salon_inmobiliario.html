<!-- [CABECERA Y ESTILOS MANTENIDOS] - [INYECCIÓN DE LÓGICA DE BÓVEDA] -->

<!-- 1. EL LOGO SAGRADO (Con el sensor de 5 toques) -->
<div id="logo-sagrado" class="cursor-pointer">
    <img src="logo-shefa.png" alt="Shefá Plus Global" class="w-[55px] h-[55px] object-cover rounded-full bg-fondoNegro">
</div>

<!-- 2. MODAL DE LA BÓVEDA ADMINISTRATIVA (OCULTO) -->
<div id="boveda-admin" class="fixed inset-0 z-[100] bg-black/90 hidden items-center justify-center p-4">
    <div class="bg-tarjetaGris border-2 border-dorado p-6 rounded-2xl w-full max-w-lg">
        <h2 class="text-white font-black text-xl mb-4 text-center">BÓVEDA ADMINISTRATIVA</h2>
        <input type="text" id="admin-nombre" placeholder="Nombre del Activo" class="w-full bg-black p-2 rounded mb-2 text-white">
        <input type="number" id="admin-precio" placeholder="Precio Total" class="w-full bg-black p-2 rounded mb-2 text-white">
        <input type="number" id="admin-fracciones" placeholder="Total Fracciones" class="w-full bg-black p-2 rounded mb-4 text-white">
        <button onclick="guardarActivo()" class="w-full bg-dorado text-black font-bold p-3 rounded">INYECTAR ACTIVO A LA MATRIZ</button>
        <button onclick="cerrarBoveda()" class="w-full text-gray-500 mt-2">Cerrar</button>
    </div>
</div>

<!-- 3. ESTRUCTURA DE LA TARJETA PREMIUM (Con Pasarela de Pago) -->
<div class="tarjeta-inmueble resplandor-dorado">
    <img src="1000020650.jpg" alt="Casa Premium" class="w-full h-48 object-cover">
    <div class="p-4">
        <h3 class="titulo-propiedad text-xl text-white font-bold">Casa Residencial Premium</h3>
        <!-- Dashboard de Fracciones -->
        <div class="my-4 space-y-2">
            <div class="flex justify-between text-xs text-gray-400">
                <span>Fracciones Disponibles: <b class="text-dorado">450 / 1000</b></span>
                <span>Valor/Fracción: <b class="text-white">$500 USD</b></span>
            </div>
            <div class="w-full bg-gray-800 rounded-full h-2">
                <div class="barra-progreso h-2 rounded-full" style="width: 55%"></div>
            </div>
        </div>
        <!-- Botón de Pago Asimétrico -->
        <button onclick="abrirPasarelaMercadoPago()" class="w-full bg-gradient-to-r from-dorado to-doradoOscuro text-black font-bold py-3 rounded uppercase tracking-widest hover:scale-105 transition-all">
            <i class="fas fa-credit-card mr-2"></i> Pagar con Mercado Pago
        </button>
    </div>
</div>

<!-- 4. MODAL PASARELA DE PAGO -->
<div id="modal-pagos" class="fixed inset-0 z-[100] bg-black/90 hidden flex items-center justify-center p-4">
    <div class="bg-tarjetaGris border border-dorado p-6 rounded-2xl w-full max-w-sm text-center">
        <h3 class="text-white text-lg font-bold mb-4 uppercase">Medios de Pago</h3>
        <div class="flex flex-col gap-3">
            <a href="TU_LINK_MERCADOPAGO_AQUI" class="p-4 bg-white text-black rounded font-bold flex items-center justify-center gap-2">
                <img src="https://upload.wikimedia.org/wikipedia/commons/8/8c/Mercado_Pago_Logo.png" class="h-6"> Mercado Pago
            </a>
            <div class="flex justify-center gap-4 mt-4">
                <i class="fab fa-cc-visa text-white text-3xl"></i>
                <i class="fab fa-cc-mastercard text-white text-3xl"></i>
                <i class="fab fa-cc-amex text-white text-3xl"></i>
            </div>
        </div>
    </div>
</div>

<script type="module">
    // ... (Tu configuración anterior) ...

    // LÓGICA DE LA BÓVEDA OCULTA (5 Taps)
    let tapCount = 0;
    document.getElementById('logo-sagrado').addEventListener('click', () => {
        tapCount++;
        if (tapCount >= 5) {
            document.getElementById('boveda-admin').classList.remove('hidden');
            document.getElementById('boveda-admin').classList.add('flex');
            tapCount = 0;
        }
    });

    window.cerrarBoveda = () => {
        document.getElementById('boveda-admin').classList.add('hidden');
    }

    // LÓGICA DE PAGO
    window.abrirPasarelaMercadoPago = () => {
        document.getElementById('modal-pagos').classList.remove('hidden');
        document.getElementById('modal-pagos').classList.add('flex');
    }
    
    // Cerrar click fuera
    window.onclick = (event) => {
        if(event.target.id == 'modal-pagos') event.target.classList.add('hidden');
    }
</script>
