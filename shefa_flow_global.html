<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHEFA FLOW | El Umbral de la Materialización</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Montserrat:wght@300;400;600;700&display=swap');
        
        body {
            background: radial-gradient(circle at 50% 0%, #0a1128 0%, #050814 80%);
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .boveda-card {
            background: rgba(10, 17, 40, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(212, 175, 55, 0.35);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9), inset 0 0 25px rgba(212, 175, 55, 0.15);
            border-radius: 28px;
        }

        /* Letras de Oro Puro */
        .titulo-oro {
            font-family: 'Cinzel', serif;
            background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 10px rgba(212, 175, 55, 0.3);
        }

        .texto-corporativo {
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        /* Números Verdes Luminosos (Pulsación Viva Berajá) */
        @keyframes pulso-verde-luminoso {
            0%, 100% { 
                color: #10B981; 
                text-shadow: 0 0 10px rgba(16, 185, 129, 0.6), 0 0 20px rgba(16, 185, 129, 0.3); 
            }
            50% { 
                color: #34D399; 
                text-shadow: 0 0 20px rgba(52, 211, 153, 0.9), 0 0 35px rgba(52, 211, 153, 0.5); 
            }
        }
        .numero-verde-luminoso {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            animation: pulso-verde-luminoso 2.5s infinite ease-in-out;
        }

        .selector-titanio {
            background: #12182b;
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: #ffffff;
            transition: all 0.3s ease;
        }
        
        .selector-titanio:focus {
            outline: none;
            border-color: #d4af37;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }

        /* Botones Asimétricos de Poder */
        .btn-web3 {
            background: linear-gradient(90deg, #F3BA2F 0%, #E8B32B 100%);
            color: #050814;
            font-weight: 800;
            border-radius: 12px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .btn-web3:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 25px rgba(243, 186, 47, 0.6);
        }

        .btn-fiat {
            background: linear-gradient(90deg, #009EE3 0%, #0088C4 100%);
            color: #fff;
            font-weight: 800;
            border-radius: 12px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .btn-fiat:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 25px rgba(0, 158, 227, 0.6);
        }

        .btn-mastercard {
            background: linear-gradient(90deg, #EB001B 0%, #F79E1B 100%);
            color: #fff;
            font-weight: 800;
            border-radius: 12px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .btn-mastercard:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 25px rgba(235, 0, 27, 0.6);
        }

        .ojo-despertar {
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
            animation: flotar-ojo 4s infinite ease-in-out;
        }
        @keyframes flotar-ojo {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }
    </style>
</head>
<body class="p-4">

    <div class="boveda-card w-full max-w-lg p-8 md:p-10 relative overflow-hidden">
        <!-- Destellos de Energía de Fondo -->
        <div class="absolute -top-12 -right-12 w-40 h-40 bg-yellow-500 rounded-full mix-blend-multiply filter blur-3xl opacity-15"></div>
        <div class="absolute -bottom-12 -left-12 w-40 h-40 bg-blue-500 rounded-full mix-blend-multiply filter blur-3xl opacity-15"></div>

        <!-- Encabezado con el Ojo del Despertar -->
        <div class="text-center mb-8 relative z-10">
            <div class="w-16 h-16 mx-auto mb-4 rounded-full p-[2px] bg-gradient-to-tr from-yellow-500 via-amber-200 to-yellow-600 ojo-despertar flex items-center justify-center bg-black">
                <div class="w-full h-full bg-[#0a1128] rounded-full flex items-center justify-center">
                    <i class="fas fa-eye text-yellow-400 text-2xl"></i>
                </div>
            </div>
            <h2 class="texto-corporativo text-[0.65rem] tracking-[0.3em] text-gray-400 mb-1">PROTOCOLO DE MATERIALIZACIÓN 2026</h2>
            <h1 class="titulo-oro text-3xl md:text-4xl font-black mb-2">SHEFA FLOW</h1>
            <p class="texto-corporativo text-[0.7rem] text-yellow-500/90 tracking-widest">El Umbral de la Economía Global</p>
        </div>

        <!-- Panel de Coordenadas / Nodo Regional -->
        <div class="mb-6 relative z-10">
            <label for="pais-selector" class="texto-corporativo block text-[0.7rem] font-semibold text-gray-300 mb-2">Nodo Regional de Expansión (Latam & EE.UU.)</label>
            <select id="pais-selector" onchange="enrutarFlujo()" class="selector-titanio w-full p-3.5 rounded-xl appearance-none cursor-pointer text-sm font-semibold">
                <option value="" disabled selected>Selecciona tu coordenada de poder...</option>
                <option value="LATAM">Argentina</option>
                <option value="LATAM">Bolivia</option>
                <option value="LATAM">Brasil</option>
                <option value="LATAM">Chile</option>
                <option value="LATAM">Colombia</option>
                <option value="LATAM">Ecuador</option>
                <option value="LATAM">El Salvador</option>
                <option value="LATAM">Guatemala</option>
                <option value="LATAM">Honduras</option>
                <option value="LATAM">México</option>
                <option value="LATAM">Perú</option>
                <option value="GLOBAL">Estados Unidos (Estándar USD)</option>
            </select>
        </div>

        <!-- Panel de Frecuencia / Monto con Números Verdes Luminosos -->
        <div id="panel-monto" class="mb-6 relative z-10 hidden">
            <div class="flex justify-between items-center mb-2">
                <label for="input-monto" class="texto-corporativo block text-[0.7rem] font-semibold text-gray-300">Frecuencia de Inyección (USDT / USD)</label>
                <span class="text-[0.65rem] text-gray-400">Flujo Áureo (3.68%)</span>
            </div>
            <div class="relative">
                <span class="absolute left-4 top-3.5 text-yellow-500 font-bold text-base">$</span>
                <input type="number" id="input-monto" placeholder="Ej: 500" class="selector-titanio w-full p-3.5 pl-10 rounded-lg outline-none numero-verde-luminoso text-lg">
            </div>
        </div>

        <!-- Panel de Canales de Transmisión -->
        <div id="panel-canales" class="space-y-4 hidden relative z-10">
            <button id="canal-web3" onclick="iniciarPagoWeb3()" class="btn-web3 w-full py-4 flex items-center justify-center gap-3 text-xs tracking-widest uppercase shadow-lg cursor-pointer">
                <i class="fas fa-cube text-base"></i> INYECCIÓN WEB3 (BNB / USDT)
            </button>

            <button id="canal-mercadopago" onclick="iniciarPagoFiat('MercadoPago')" class="btn-fiat w-full py-4 flex items-center justify-center gap-3 text-xs tracking-widest uppercase shadow-lg hidden cursor-pointer">
                <i class="fas fa-handshake text-base"></i> MERCADO PAGO (Latam Local)
            </button>

            <button id="canal-mastercard" onclick="iniciarPagoFiat('Mastercard_Internacional')" class="btn-mastercard w-full py-4 flex items-center justify-center gap-3 text-xs tracking-widest uppercase shadow-lg cursor-pointer">
                <i class="fas fa-credit-card text-base"></i> MASTERCARD / VISA INT.
            </button>
        </div>
        
        <!-- Estado del Río de Luz con Números Verdes Luminosos -->
        <div id="mensaje-enrutamiento" class="texto-corporativo text-[0.65rem] text-center text-gray-400 mt-6 hidden border-t border-gray-800 pt-4">
            Río de Luz <span class="numero-verde-luminoso">Shefa-Berajá</span> fluyendo matemáticamente en la red.
        </div>
        
        <input type="hidden" id="metodo-pago" value="">
    </div>

    <script>
        // Sistema de Enrutamiento Cuántico Regional
        function enrutarFlujo() {
            const selector = document.getElementById('pais-selector');
            const zona = selector.value;
            const paisNombre = selector.options[selector.selectedIndex].text;
            
            const panelMontos = document.getElementById('panel-monto');
            const panelCanales = document.getElementById('panel-canales');
            const btnMP = document.getElementById('canal-mercadopago');
            const mensaje = document.getElementById('mensaje-enrutamiento');

            panelMontos.classList.remove('hidden');
            panelCanales.classList.remove('hidden');
            mensaje.classList.remove('hidden');

            if (zona === 'LATAM') {
                btnMP.classList.remove('hidden');
                mensaje.innerHTML = `Nodo Regional [<span class="text-white font-bold">${paisNombre}</span>] sincronizado. Canales locales e inyección Web3 activos.`;
            } else if (zona === 'GLOBAL') {
                btnMP.classList.add('hidden');
                mensaje.innerHTML = `Nodo Internacional [<span class="text-white font-bold">${paisNombre}</span>] conectado al estándar USD y Web3.`;
            }
        }

        // Inyección Web3 Real (Conexión a Wallet y Transacción de Capital)
        async function iniciarPagoWeb3() {
            const monto = document.getElementById('input-monto').value;
            if (!monto || monto <= 0) {
                alert("👑 BÓVEDA SHEFA:\n\nIngresa una frecuencia (Monto) válida de Oro Puro para materializar.");
                return;
            }

            if (typeof window.ethereum !== 'undefined') {
                try {
                    // Solicitar conexión a la Wallet (MetaMask, Trust Wallet en Moto G04)
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    const account = accounts[0];
                    
                    alert(`👑 BÓVEDA SHEFA WEB3:\n\nWallet conectada: ${account.substring(0,6)}...${account.substring(38)}\nIniciando transferencia de $${monto} USDT/BNB a la tesorería global...`);
                    
                    // Aquí puedes acoplar la llamada real al contrato inteligente o transacción nativa
                    // const transactionParameters = { ... };
                    // const txHash = await window.ethereum.request({ method: 'eth_sendTransaction', params: [transactionParameters] });

                } catch (error) {
                    console.error(error);
                    alert("Fricción detectada en la red Web3 o usuario canceló la firma.");
                }
            } else {
                // Si el navegador móvil no tiene inyección directa, abrimos pasarela descentralizada de respaldo o enlace de pago web3
                window.open(`https://metamask.app.link/dapp/shefaplusglobal.com?monto=${monto}`, '_blank');
            }
        }

        // Inyección Tradicional Fiat Real (Redirección a pasarela de cobro con monto dinámico)
        function iniciarPagoFiat(metodoSeleccionado) {
            const monto = document.getElementById('input-monto').value;
            const paisSelector = document.getElementById('pais-selector');
            const pais = paisSelector.options[paisSelector.selectedIndex] ? paisSelector.options[paisSelector.selectedIndex].text : 'Global';

            if (!monto || monto <= 0) {
                alert("👑 BÓVEDA SHEFA:\n\nIngresa una frecuencia (Monto) válida de Oro Puro para materializar.");
                return;
            }
            document.getElementById('metodo-pago').value = metodoSeleccionado;

            if (metodoSeleccionado === 'MercadoPago') {
                // Generación de enlace de redirección dinámico hacia Mercado Pago o pasarela local configurada
                // Reemplaza con tu enlace real de cobro o preferencia de Mercado Pago
                const urlMercadoPago = `https://www.mercadopago.com.co/checkout/v1/redirect?pref_id=TU_PREFERENCE_ID_O_LINK&amount=${monto}&pais=${encodeURIComponent(pais)}`;
                
                alert(`👑 BÓVEDA SHEFA FIAT:\n\nRedirigiendo al nodo de Mercado Pago (${pais}) por un valor de $${monto} USD/Moneda Local...`);
                
                // Redirección real (Descomenta cuando tengas tu link de Mercado Pago configurado)
                // window.location.href = urlMercadoPago;

            } else if (metodoSeleccionado === 'Mastercard_Internacional') {
                // Pasarela internacional de tarjetas (Stripe / Pasarela Global)
                const urlInternacional = `https://checkout.shefaplusglobal.com/pay?amount=${monto}&gateway=mastercard`;
                
                alert(`👑 BÓVEDA SHEFA GLOBAL:\n\nAbriendo pasarela internacional segura Mastercard / Visa por un valor de $${monto} USD...`);
                
                // Redirección real
                // window.location.href = urlInternacional;
            }
        }
    </script>
</body>
</html>
