<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antojos de Sal - Dulce Tentación</title>
    <style>
        /* Variables con proporciones armónicas (Fibonacci) para un diseño fluido */
        :root {
            --fib-xs: 5px;
            --fib-sm: 8px;
            --fib-md: 13px;
            --fib-lg: 21px;
            --fib-xl: 34px;
            
            /* Paleta de colores basada en tu interfaz de Shefa Plus Global */
            --color-bg: #f8f9fa;
            --color-card: #ffffff;
            --color-text-main: #333333;
            --color-text-mut: #6c757d;
            --color-accent: #d84315; /* Naranja/Rojo de precios y botones */
            --color-cart-bg: #3e2723; /* Marrón oscuro del total */
            --color-btn-pay: #ffb300; /* Amarillo del botón pagar */
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--color-bg);
            margin: 0;
            padding: 0;
            padding-bottom: 120px; /* Espacio para que el carrito no tape contenido */
        }

        /* Contenedor del Catálogo Grid */
        .catalogo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: var(--fib-lg);
            padding: var(--fib-lg);
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Tarjeta de Producto */
        .producto-card {
            background-color: var(--color-card);
            border-radius: var(--fib-lg);
            overflow: hidden;
            box-shadow: 0 4px 13px rgba(0,0,0,0.06);
            transition: transform 0.2s ease-out;
        }

        /* Espacio para la foto */
        .producto-img-box {
            width: 100%;
            height: 180px;
            background-color: #e9ecef; /* Tono gris claro para el espacio vacío */
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .img-placeholder-text {
            color: #adb5bd;
            font-size: 0.9em;
            font-weight: 500;
        }

        .producto-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .producto-info {
            padding: var(--fib-lg);
        }

        .producto-titulo {
            margin: 0 0 var(--fib-sm) 0;
            font-size: 1.15em;
            color: var(--color-text-main);
            font-weight: 600;
        }

        .producto-desc {
            font-size: 0.85em;
            color: var(--color-text-mut);
            margin-bottom: var(--fib-md);
            line-height: 1.5;
        }

        .producto-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: var(--fib-md);
        }

        .producto-precio {
            color: var(--color-accent);
            font-weight: 700;
            font-size: 1.25em;
        }

        .btn-agregar {
            background-color: var(--color-accent);
            color: white;
            border: none;
            padding: var(--fib-sm) var(--fib-lg);
            border-radius: 34px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(216, 67, 21, 0.3);
        }

        .btn-agregar:active {
            transform: scale(0.95);
        }

        /* Carrito Flotante Inferior (Nexus Style) */
        .carrito-flotante {
            position: fixed;
            bottom: var(--fib-md);
            left: var(--fib-md);
            right: var(--fib-md);
            background-color: var(--color-cart-bg);
            border-radius: var(--fib-xl);
            padding: var(--fib-md) var(--fib-lg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 21px rgba(0,0,0,0.25);
            z-index: 1000;
            max-width: 600px;
            margin: 0 auto;
        }

        .carrito-textos {
            display: flex;
            flex-direction: column;
        }

        .carrito-label {
            color: #d7ccc8;
            font-size: 0.75em;
            margin-bottom: 2px;
        }

        .carrito-total {
            color: white;
            font-size: 1.3em;
            font-weight: 700;
            margin: 0;
        }

        .btn-pagar {
            background-color: var(--color-btn-pay);
            color: var(--color-cart-bg);
            border: none;
            padding: 10px var(--fib-lg);
            border-radius: 34px;
            font-weight: 700;
            font-size: 0.95em;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }
    </style>
</head>
<body>

    <div class="catalogo-grid" id="contenedor-sal">
        </div>

    <div class="carrito-flotante">
        <div class="carrito-textos">
            <span class="carrito-label">Total estimado</span>
            <h3 class="carrito-total" id="total-estimado">$0</h3>
        </div>
        <button class="btn-pagar">Pagar Pedido ➔</button>
    </div>

    <script>
        // Array de datos de los antojos de sal
        const inventarioSal = [
            {
                id: 'sal-01',
                nombre: 'Empanada Tradicional',
                descripcion: 'Crocante empanada rellena de carne desmechada y papa, acompañada de nuestro ají casero.',
                precio: 2500,
                imagen: '' 
            },
            {
                id: 'sal-02',
                nombre: 'Palito de Queso',
                descripcion: 'Masa suave y horneada rellena de abundante queso doble crema derretido.',
                precio: 3500,
                imagen: ''
            },
            {
                id: 'sal-03',
                nombre: 'Arepa de Choclo',
                descripcion: 'Dulce y tierna arepa de maíz tierno, coronada con una generosa tajada de queso campesino.',
                precio: 4500,
                imagen: ''
            },
            {
                id: 'sal-04',
                nombre: 'Papa Rellena',
                descripcion: 'Deliciosa masa de papa dorada, rellena con un guiso de carne, arroz y huevo duro.',
                precio: 4000,
                imagen: ''
            }
        ];

        let totalCarrito = 0;

        // Formato moneda colombiana (COP)
        const formatearCOP = (valor) => {
            return new Intl.NumberFormat('es-CO', {
                style: 'currency',
                currency: 'COP',
                minimumFractionDigits: 0
            }).format(valor);
        };

        // Renderizado dinámico
        const renderizarCatalogo = () => {
            const contenedor = document.getElementById('contenedor-sal');
            contenedor.innerHTML = ''; 

            inventarioSal.forEach(producto => {
                const estiloImagen = producto.imagen ? `style="opacity: 1;" src="${producto.imagen}"` : '';

                const tarjetaHTML = `
                    <div class="producto-card">
                        <div class="producto-img-box">
                            <span class="img-placeholder-text">Foto - ${producto.nombre}</span>
                            <img class="producto-img" alt="${producto.nombre}" ${estiloImagen}>
                        </div>
                        <div class="producto-info">
                            <h3 class="producto-titulo">${producto.nombre}</h3>
                            <p class="producto-desc">${producto.descripcion}</p>
                            <div class="producto-footer">
                                <span class="producto-precio">${formatearCOP(producto.precio)}</span>
                                <button class="btn-agregar" onclick="agregarAlCarrito(${producto.precio})">+ Agregar</button>
                            </div>
                        </div>
                    </div>
                `;
                contenedor.innerHTML += tarjetaHTML;
            });
        };

        // Lógica del carrito con feedback háptico
        const agregarAlCarrito = (precio) => {
            totalCarrito += precio;
            document.getElementById('total-estimado').innerText = formatearCOP(totalCarrito);
            
            if(navigator.vibrate) navigator.vibrate(34); // Vibración armónica
        };

        // Ejecutar al cargar la página
        document.addEventListener('DOMContentLoaded', renderizarCatalogo);

    </script>
</body>
</html>
